name: CodeSentinel AI Review

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

env:
  CODESENTINEL_API_URL: "https://codesentinel-4xdx.onrender.com"
  CODESENTINEL_TOKEN: ${{ secrets.CODESENTINEL_TOKEN }}

jobs:
  codesentinel_review:
    name: CodeSentinel Security & Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Secret Validation
        run: |
          if [ -z "${{ env.CODESENTINEL_TOKEN }}" ]; then
            echo "Error: CODESENTINEL_TOKEN is empty or not set in GitHub Secrets."
            exit 1
          fi

      - name: Wake Server Health Check
        run: |
          URL="${{ env.CODESENTINEL_API_URL }}/health"
          echo "Checking CodeSentinel Server health at $URL..."
          for i in 1 2 3; do
            if curl -s -f "$URL" > /dev/null; then
              echo "Server is awake and healthy."
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "Server health check failed after 3 attempts."
          exit 1

      - name: CodeSentinel Review & Report
        run: |
          cat << 'EOF' > review.cjs
          const { execSync } = require('child_process');
          const fs = require('fs');

          const API_URL = process.env.CODESENTINEL_API_URL.replace(/\/$/, '');
          const TOKEN = process.env.CODESENTINEL_TOKEN;
          const BASE_REF = process.env.GITHUB_BASE_REF ? `origin/${process.env.GITHUB_BASE_REF}` : 'HEAD^1';

          const SKIP_PATTERNS = ["package-lock.json", "node_modules/", "dist/", ".min.js"];
          const BINARY_EXT = [".png", ".jpg", ".zip", ".pdf", ".lock", ".mp4", ".svg", ".map"];
          const MAX_FILES = 50;
          const MAX_DIFF_SIZE = 500 * 1024; // 500KB

          function getDiffs() {
              try {
                  const changedFilesRaw = execSync(`git diff --name-status ${BASE_REF} HEAD`).toString().trim();
                  if (!changedFilesRaw) return [];
                  
                  let changedFiles = changedFilesRaw.split('\n').map(line => {
                      const parts = line.split(/\s+/);
                      return { status: parts[0], file: parts[1] };
                  }).filter(item => {
                      if (!item || !item.file) return false;
                      const file = item.file;
                      if (SKIP_PATTERNS.some(p => file.includes(p))) return false;
                      if (BINARY_EXT.some(ext => file.endsWith(ext))) return false;
                      return true;
                  });

                  if (changedFiles.length > MAX_FILES) {
                      console.log(`Too many files changed (${changedFiles.length}). Limiting to ${MAX_FILES}.`);
                      changedFiles.length = MAX_FILES;
                  }

                  const diffs = [];
                  let totalSize = 0;
                  for (const item of changedFiles) {
                      const file = item.file;
                      try {
                          const diff = execSync(`git diff ${BASE_REF} HEAD -- "${file}"`).toString();
                          if (totalSize + diff.length > MAX_DIFF_SIZE) {
                              console.log(`Max diff size reached (500KB). Skipping remaining files.`);
                              break;
                          }
                          
                          let changeType = 'modified';
                          if (item.status.startsWith('A')) changeType = 'added';
                          else if (item.status.startsWith('D')) changeType = 'deleted';
                          else if (item.status.startsWith('R')) changeType = 'renamed';

                          diffs.push({ filePath: file, changeType, diffContent: diff });
                          totalSize += diff.length;
                      } catch (e) {
                          console.warn(`Could not get diff for ${file}`);
                      }
                  }
                  return diffs;
              } catch (e) {
                  console.error("Error getting git diffs:", e.message);
                  return [];
              }
          }

          async function run() {
              const diffs = getDiffs();
              if (diffs.length === 0) {
                  console.log("No valid files to review.");
                  fs.writeFileSync('cs_report.json', JSON.stringify({ status: 'skipped', reason: 'No files to review' }));
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## 🛡️ CodeSentinel Review\n\n✅ No files to review.\n");
                  return;
              }

              const payload = JSON.stringify({ 
                  prNumber: process.env.GITHUB_REF_NAME || 'local',
                  repository: process.env.GITHUB_REPOSITORY || 'unknown',
                  commit: process.env.GITHUB_SHA || 'unknown',
                  files: diffs 
              });
              let responseData = null;

              for (let attempt = 1; attempt <= 3; attempt++) {
                  try {
                      const controller = new AbortController();
                      const timeout = setTimeout(() => controller.abort(), 120000); // 120s
                      
                      console.log(`Sending diff to CodeSentinel (Attempt ${attempt}/3)...`);
                      const res = await fetch(`${API_URL}/api/review`, {
                          method: 'POST',
                          headers: {
                              'Content-Type': 'application/json',
                              'Authorization': `Bearer ${TOKEN}`
                          },
                          body: payload,
                          signal: controller.signal
                      });
                      clearTimeout(timeout);

                      if (res.ok) {
                          responseData = await res.json();
                          break;
                      }

                      if (res.status === 429 || res.status >= 500) {
                          console.log(`Server error ${res.status}. Retrying in ${attempt * 5}s...`);
                          await new Promise(r => setTimeout(r, attempt * 5000));
                          continue;
                      }

                      const errText = await res.text();
                      throw new Error(`API failed with status ${res.status} - ${errText}`);
                  } catch (error) {
                      console.error(`Attempt ${attempt} failed: ${error.message}`);
                      if (attempt === 3) {
                          fs.writeFileSync('cs_report.json', JSON.stringify({ status: 'error', error: error.message }));
                          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## 🛡️ CodeSentinel Review\n\n❌ Review failed: ${error.message}\n`);
                          process.exit(1);
                      }
                      await new Promise(r => setTimeout(r, attempt * 5000));
                  }
              }

              if (responseData) {
                  fs.writeFileSync('cs_report.json', JSON.stringify(responseData, null, 2));
                  
                  let md = `## 🛡️ CodeSentinel Review\n\n`;
                  const criticalCount = responseData.criticalCount || responseData.critical || 0;
                  const issues = responseData.issues || [];
                  
                  md += `**Critical Issues:** ${criticalCount}\n`;
                  md += `**Total Issues:** ${issues.length}\n\n`;
                  
                  if (issues.length > 0) {
                      for (const issue of issues) {
                          const severity = (issue.severity || 'INFO').toUpperCase();
                          md += `- **${severity}** in \`${issue.file || 'unknown'}\`: ${issue.message}\n`;
                      }
                  } else {
                      md += `✅ No issues found!\n`;
                  }
                  
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
                  
                  if (criticalCount > 0) {
                      console.error("Critical issues found! Failing pipeline.");
                      process.exit(1);
                  }
              }
          }

          run();
          EOF
          node review.cjs

      - name: Upload Review Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesentinel-report
          path: cs_report.json
          retention-days: 7
